{% load static %}
<header id="header">
    <div class="header-top">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6 col-sm-6 col-6 header-top-left">
                {% if request.user.is_authenticated %}
                    <ul>
                        <li><a href="{% url 'accounts:login' %}">login as {{ user.username }}</a></li>
                        <li><a href="{% url 'accounts:logout' %}">logout</a></li>
                    </ul>
                {% else %}
                    <ul>
                        <li><a href="{% url 'accounts:login' %}">login</a></li>
                        <li><a href="{% url 'accounts:signup' %}">sing up</a></li>
                    </ul>
                {% endif %}
                </div>
                <div class="col-lg-6 col-sm-6 col-6 header-top-right">
                    <div class="header-social">
                        <a href="#"><i class="fa fa-facebook"></i></a>
                        <a href="#"><i class="fa fa-twitter"></i></a>
                        <a href="#"><i class="fa fa-dribbble"></i></a>
                        <a href="#"><i class="fa fa-behance"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container main-menu">
        <div class="row align-items-center justify-content-between d-flex">
            <div id="logo">
                <a href="{% url 'website:home' %}"><img src={% static "img/logo.png" %} alt="" title=""></a>
            </div>
            <nav id="nav-menu-container">
                <ul class="nav-menu">
                    <li><a href="{% url 'website:home' %}">Home</a></li>
                    <li><a href="{% url 'website:about' %}">About</a></li>
                    <li><a href="{% url 'blog:blog_home' %}">Blog</a></li>
                    <li><a href="{% url 'website:contact' %}">Contact</a></li>
                </ul>
            </nav><!-- #nav-menu-container -->
        </div>
    </div>
</header>
