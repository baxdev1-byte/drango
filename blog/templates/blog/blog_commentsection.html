{% load static %}
<div class="comments-area">
    <h4>{{ comments|length }} Comments</h4>
    <div class="comment-list">
        {% for comment in comments %}
            <div class="single-comment justify-content-between d-flex">
                <div class="user justify-content-between d-flex">
                    <div class="thumb">
                        <img src={% static "img/blog/c1.jpg" %} alt="">
                    </div>
                    <div class="desc">
                        <h5><a href="#">{{ comment.author }}</a></h5>
                        <p class="date">{{ comment.date|date:"d M Y" }} </p>
                        <p class="comment">
                            {{ comment.message }}
                        </p>
                    </div>
                </div>
                <!--<div class="reply-btn">
                    <a href="" class="btn-reply text-uppercase">reply</a>
                </div>
                -->
            </div>
        {% endfor %}
    </div>
</div>
<div class="comment-form">
    <h4>Leave a Comment</h4>
    <form method="post" action="{% url 'blog:blog_details' pid=posts.id %}">
        {% csrf_token %}
        <div class="form-group form-inline">
            <input type="hidden" name="post" value="{{ posts.id }}">
            <input type="hidden" name="author" value="{{ request.user.id }}">
        </div>
        <div class="form-group">
                <input type="email" class="form-control" name="email"
                       placeholder="Enter email address" onfocus="this.placeholder = ''"
                       onblur="this.placeholder = 'Enter email address'">
        </div>
        <div class="form-group">
            <input type="text" class="form-control" name="subject" placeholder="Subject"
                   onfocus="this.placeholder = ''" onblur="this.placeholder = 'Subject'">
        </div>
        <div class="form-group">
            <textarea class="form-control mb-10" rows="5" name="message" placeholder="Messege"
                      onfocus="this.placeholder = ''" onblur="this.placeholder = 'Messege'"
                      required=""></textarea>
        </div>
        <button type="submit" class="primary-btn text-uppercase">Post Comment</button>
    </form>
</div>
